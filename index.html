<meta charset="utf-8">
<title>Abasto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#fafaf7; --paper-50:#fdfdfb; --paper-100:#f6f5ee; --paper-200:#ebe9dd;
  --ink-900:#1c1917; --ink-800:#292524; --ink-700:#44403c; --ink-600:#57534e; --ink-500:#78716c; --ink-400:#a8a29e; --ink-300:#d6d3d1; --ink-200:#e7e5e4; --ink-100:#f5f5f4;
  --brand:#1e40af; --brand-50:#eff4ff; --brand-100:#dbe6fe; --brand-200:#bfd3fc; --brand-700:#1b3a9c; --brand-800:#1a3486; --brand-900:#172e75;
  --accent:#c2410c; --accent-50:#fff7ed; --accent-100:#ffedd5; --accent-500:#f97316; --accent-600:#ea580c; --accent-700:#c2410c; --accent-800:#9a3412;
  --chart-blue:#3355c9; --chart-orange:#f97316; --chart-aqua:#1baf7a; --chart-yellow:#eda100;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --bg:var(--paper); --surface:#ffffff; --surface-2:var(--paper-100); --surface-3:var(--paper-200);
  --text-1:var(--ink-900); --text-2:var(--ink-600); --text-3:var(--ink-500);
  --border:var(--paper-200); --border-2:var(--ink-300);
  --shadow-card:0 1px 0 rgba(28,25,23,.04),0 1px 2px rgba(28,25,23,.04);
  --shadow-lift:0 2px 8px rgba(28,25,23,.08),0 1px 2px rgba(28,25,23,.05);
  --font-display:'Fraunces',Georgia,serif; --font-sans:'Inter Tight',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1715; --surface:#242019; --surface-2:#211d1a; --surface-3:#2b2622;
    --text-1:#f5f4f1; --text-2:#cbc6bd; --text-3:#9c958a;
    --border:#3a352e; --border-2:#4d473e;
    --brand:#5b82e8; --brand-50:#1a2340; --brand-100:#243266; --brand-200:#2e4086; --brand-700:#3a63c9; --brand-800:#2e4ea8; --brand-900:#26407e;
    --accent:#fb923c; --accent-50:#2e1d10; --accent-100:#4a2c14; --accent-500:#f97316; --accent-600:#fb923c; --accent-700:#fdba74; --accent-800:#fed7aa;
    --chart-blue:#5b82e8; --chart-orange:#d95926; --chart-aqua:#199e70; --chart-yellow:#c98500;
    --shadow-card:0 1px 0 rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.3);
    --shadow-lift:0 4px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1715; --surface:#242019; --surface-2:#211d1a; --surface-3:#2b2622;
  --text-1:#f5f4f1; --text-2:#cbc6bd; --text-3:#9c958a;
  --border:#3a352e; --border-2:#4d473e;
  --brand:#5b82e8; --brand-50:#1a2340; --brand-100:#243266; --brand-200:#2e4086; --brand-700:#3a63c9; --brand-800:#2e4ea8; --brand-900:#26407e;
  --accent:#fb923c; --accent-50:#2e1d10; --accent-100:#4a2c14; --accent-500:#f97316; --accent-600:#fb923c; --accent-700:#fdba74; --accent-800:#fed7aa;
  --chart-blue:#5b82e8; --chart-orange:#d95926; --chart-aqua:#199e70; --chart-yellow:#c98500;
  --shadow-card:0 1px 0 rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.3);
  --shadow-lift:0 4px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text-1); font-family:var(--font-sans); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; min-height:100vh; position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:radial-gradient(currentColor 1px,transparent 1px); background-size:24px 24px; color:var(--border);
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
a{color:inherit;}
button{font-family:inherit;}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;}
.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.figure{font-family:var(--font-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em;}
.kicker{font-family:var(--font-sans);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;font-weight:600;color:var(--text-3);}
.editorial-rule::after{content:"";display:block;width:2.5rem;height:2px;background:var(--accent-500);margin-top:.5rem;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;}
:focus-visible{outline:2px solid var(--accent-500);outline-offset:2px;}

/* ---------- layout shell ---------- */
#root{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.topbar__inner{max-width:1600px;margin:0 auto;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;}
.iconbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:3px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-size:18px;}
.iconbtn:hover{background:var(--surface-3);color:var(--text-1);}
.brandmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-1);cursor:pointer;background:none;border:none;}
.brandmark__badge{width:30px;height:30px;border-radius:4px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex-shrink:0;}
.brandmark__word{display:flex;flex-direction:column;line-height:1;}
.brandmark__word b{font-family:var(--font-display);font-size:17px;font-weight:500;letter-spacing:-.01em;}
.brandmark__word span{margin-top:3px;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);}
.topbar__right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.syncpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);padding:0 8px;}
.syncpill .ic{color:var(--good);}
.userchip{font-size:13px;color:var(--text-2);padding:0 6px;display:none;}
@media(min-width:768px){.userchip{display:inline;}}

.sidebar-overlay{position:fixed;inset:0;z-index:40;background:rgba(20,17,15,.5);backdrop-filter:blur(2px);transition:opacity .25s ease;}
.sidebar{position:fixed;left:0;top:0;z-index:50;height:100%;width:280px;background:var(--brand-900);color:var(--paper);display:flex;flex-direction:column;box-shadow:var(--shadow-lift);transform:translateX(-100%);transition:transform .25s ease-out;}
.sidebar.open{transform:translateX(0);}
.sidebar__head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar__head b{font-family:var(--font-display);font-size:19px;font-weight:500;}
.sidebar__head span{display:block;margin-top:2px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--brand-200);}
.sidebar__nav{flex:1;overflow-y:auto;padding:14px 0;}
.sidebar__kicker{color:var(--brand-200)!important;padding:0 20px;margin-bottom:6px;}
.sidebar__item{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:14px;color:var(--brand-100);text-decoration:none;position:relative;cursor:pointer;background:none;border:none;width:100%;text-align:left;}
.sidebar__item:hover{background:rgba(255,255,255,.08);color:#fff;}
.sidebar__item.active{background:rgba(0,0,0,.22);color:#fff;font-weight:600;}
.sidebar__item.active::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--accent-500);}
.sidebar__item .ic{font-size:17px;color:var(--brand-200);}
.sidebar__item.active .ic{color:var(--accent-500);}
.sidebar__foot{border-top:1px solid rgba(255,255,255,.12);padding:14px 20px;}
.sidebar__foot .name{font-size:13px;font-weight:500;color:#fff;}
.sidebar__foot .mail{font-size:11px;color:var(--brand-200);}
.sidebar__logout{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:3px;background:transparent;color:#fff;font-size:13px;cursor:pointer;}
.sidebar__logout:hover{border-color:var(--accent-500);background:rgba(255,255,255,.06);}

main.content{max-width:1600px;margin:0 auto;padding:24px 16px 64px;width:100%;position:relative;z-index:1;flex:1;}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:3px;border:1px solid transparent;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;transition:background .15s,border-color .15s,color .15s;}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-primary{background:var(--ink-900);color:var(--paper);}
.btn-primary:hover{background:var(--accent-700);}
.btn-secondary{background:var(--brand);color:#fff;}
.btn-secondary:hover{background:var(--brand-700);}
.btn-outline{background:transparent;border-color:var(--border-2);color:var(--text-1);}
.btn-outline:hover{background:var(--surface-3);}
.btn-ghost{background:transparent;color:var(--text-2);}
.btn-ghost:hover{background:var(--surface-3);color:var(--text-1);}
.btn-danger{background:transparent;border-color:var(--critical);color:var(--critical);}
.btn-danger:hover{background:var(--critical);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{background:inherit;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:2px;line-height:1.3;white-space:nowrap;}
.badge-a{background:#dcfce7;color:#166534;} .badge-b{background:#fef3c7;color:#92400e;} .badge-c{background:var(--ink-200);color:var(--ink-700);} .badge-d{background:var(--paper-100);color:var(--text-3);border:1px solid var(--border);}
.badge-good{background:#dcfce7;color:#166534;} .badge-warn{background:#fef3c7;color:#92400e;} .badge-crit{background:#fee2e2;color:#991b1b;} .badge-info{background:var(--brand-100);color:var(--brand-800);} .badge-neutral{background:var(--surface-3);color:var(--text-2);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .badge-a{background:#123a22;color:#86efac;}
  :root:not([data-theme="light"]) .badge-b{background:#3d2c07;color:#fcd34d;}
  :root:not([data-theme="light"]) .badge-good{background:#123a22;color:#86efac;}
  :root:not([data-theme="light"]) .badge-warn{background:#3d2c07;color:#fcd34d;}
  :root:not([data-theme="light"]) .badge-crit{background:#43171a;color:#fca5a5;}
  :root:not([data-theme="light"]) .badge-info{background:#243266;color:#dbe6fe;}
}
:root[data-theme="dark"] .badge-a{background:#123a22;color:#86efac;}
:root[data-theme="dark"] .badge-b{background:#3d2c07;color:#fcd34d;}
:root[data-theme="dark"] .badge-good{background:#123a22;color:#86efac;}
:root[data-theme="dark"] .badge-warn{background:#3d2c07;color:#fcd34d;}
:root[data-theme="dark"] .badge-crit{background:#43171a;color:#fca5a5;}
:root[data-theme="dark"] .badge-info{background:#243266;color:#dbe6fe;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);text-decoration:none;cursor:pointer;}
.chip:hover{border-color:var(--border-2);color:var(--text-1);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow-card);}
.card-pad{padding:16px 18px;}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-title h2{font-size:20px;}
.section-title p{margin:4px 0 0;color:var(--text-3);font-size:13px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--border-2);border:1px solid var(--border-2);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.kpi{background:var(--surface);padding:16px 18px;position:relative;overflow:hidden;transition:background .15s;}
.kpi:hover{background:var(--surface-2);}
.kpi__top{display:flex;align-items:flex-start;justify-content:space-between;}
.kpi__idx{font-family:var(--font-mono);font-size:11px;color:var(--text-3);}
.kpi__icon{color:var(--accent-500);font-size:16px;}
.kpi .kicker{margin-top:10px;}
.kpi__value{font-size:28px;margin-top:4px;}
.kpi__sub{font-size:11.5px;color:var(--text-3);margin-top:4px;}
.kpi__rule{height:2px;width:20px;background:var(--border-2);margin-top:10px;transition:width .2s,background .2s;}
.kpi:hover .kpi__rule{width:100%;background:var(--accent-500);}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;}
.toolbar-spacer{flex:1;}
.field{display:flex;flex-direction:column;gap:4px;}
.field > label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.input,.select,textarea.input{font-family:var(--font-sans);font-size:13px;padding:8px 10px;border:1px solid var(--border-2);border-radius:3px;background:var(--surface);color:var(--text-1);}
textarea.input{font-family:var(--font-sans);resize:vertical;}
.input:focus,.select:focus{outline:2px solid var(--accent-500);outline-offset:-1px;border-color:var(--accent-500);}
.searchbox{position:relative;flex:1;min-width:180px;max-width:340px;}
.searchbox .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);}
.searchbox input{width:100%;padding-left:30px;}
.togglebtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);cursor:pointer;}
.togglebtn .dot{width:8px;height:8px;border-radius:50%;background:var(--border-2);}
.togglebtn.on{background:var(--ink-900);color:var(--paper);border-color:var(--ink-900);}
.togglebtn.on .dot{background:var(--accent-500);}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px;background:var(--surface);}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
.tbl thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:700;border-bottom:1px solid var(--border-2);white-space:nowrap;cursor:pointer;user-select:none;}
.tbl thead th:hover{color:var(--text-1);}
.tbl thead th.num,.tbl td.num{text-align:right;}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl tbody tr:hover{background:var(--accent-50);}
.tbl tbody tr.clickable{cursor:pointer;}
.tbl tfoot td{padding:9px 12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--surface-2);}
.sortarrow{font-size:9px;margin-left:3px;color:var(--accent-500);}
.tbl-empty{padding:32px;text-align:center;color:var(--text-3);font-size:13px;}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 12px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);}
.pager button{border:1px solid var(--border-2);background:var(--surface);border-radius:3px;width:26px;height:26px;cursor:pointer;color:var(--text-2);}
.pager button:disabled{opacity:.4;cursor:default;}

.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.pill-tab{padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--text-3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;}
.pill-tab.active{color:var(--text-1);border-color:var(--accent-500);}
.pill-tab .count{background:var(--surface-3);color:var(--text-2);border-radius:10px;padding:1px 7px;font-size:11px;}
.pill-tab.active .count{background:var(--ink-900);color:var(--paper);}

.progress{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.progress__bar{height:100%;border-radius:4px;background:var(--brand);}

.modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(20,17,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;}
.modal{background:var(--surface);border-radius:6px;box-shadow:var(--shadow-lift);width:100%;max-width:560px;margin-bottom:5vh;}
.modal.wide{max-width:760px;}
.modal__head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal__head h3{font-size:17px;}
.modal__body{padding:18px 20px;max-height:64vh;overflow-y:auto;}
.modal__foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.radiorow{display:flex;gap:8px;flex-wrap:wrap;}
.radiocard{flex:1;min-width:120px;border:1px solid var(--border-2);border-radius:4px;padding:9px 11px;cursor:pointer;font-size:12.5px;color:var(--text-2);}
.radiocard.sel{border-color:var(--accent-500);background:var(--accent-50);color:var(--text-1);font-weight:600;}
.preview-box{background:var(--surface-2);border:1px dashed var(--border-2);border-radius:4px;padding:12px 14px;font-size:13px;color:var(--text-2);}
.preview-box b{color:var(--text-1);font-family:var(--font-display);font-size:17px;}

.toast-stack{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink-900);color:var(--paper);padding:11px 16px;border-radius:4px;font-size:13px;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:8px;animation:toastin .2s ease-out;max-width:340px;}
.toast.ok .ic{color:#4ade80;} .toast.err .ic{color:#f87171;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.notif-pop{position:absolute;top:52px;right:16px;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-lift);z-index:45;max-height:420px;overflow-y:auto;}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-500);margin-top:5px;flex-shrink:0;}

.chatfab{position:fixed;bottom:20px;right:20px;z-index:55;width:52px;height:52px;border-radius:50%;background:var(--ink-900);color:var(--paper);border:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:var(--shadow-lift);}
.chatfab:hover{background:var(--accent-700);}
.chatpanel{position:fixed;bottom:82px;right:20px;z-index:55;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:70vh;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;overflow:hidden;}
.chatpanel__head{background:var(--brand-900);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.chatpanel__body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chatmsg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;}
.chatmsg.bot{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:2px;}
.chatmsg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:2px;}
.chatsuggest{font-size:12px;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text-2);}
.chatsuggest:hover{border-color:var(--accent-500);color:var(--text-1);}
.chatpanel__foot{border-top:1px solid var(--border);padding:10px;display:flex;gap:6px;}
.chatpanel__foot input{flex:1;}

.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;position:relative;z-index:1;}
@media(max-width:860px){.login-wrap{grid-template-columns:1fr;}}
.login-left{padding:56px;display:flex;flex-direction:column;justify-content:center;position:relative;}

<script>
// ===================== RNG determinístico (datos estables entre renders) =====================
let __seed = 987654321;
function rand(){ __seed = (__seed*1103515245+12345)&0x7fffffff; return __seed/0x7fffffff; }
function ri(a,b){ return Math.floor(rand()*(b-a+1))+a; }
function rf(a,b,d){ d=d==null?1:d; return +(rand()*(b-a)+a).toFixed(d); }
function pick(arr){ return arr[Math.floor(rand()*arr.length)]; }
function uid(){ return 'u'+(++__uidc); } let __uidc=0;

const NOW = new Date(2026,7,25);
const EMPRESA = { nombre:'Rumbo Repuestos S.A.', giro:'Distribución de repuestos y accesorios automotrices', sku:18400, sucursalesN:12 };

// ===================== Maestros =====================
const SUCURSALES = [
  {id:'ALT',nombre:'Altavista',taller:true},
  {id:'POR',nombre:'Portezuelo',taller:true},
  {id:'RIO',nombre:'Rioseco',taller:true},
  {id:'VHM',nombre:'Valle Hermoso',taller:true},
  {id:'MIR',nombre:'Miraflores',taller:false},
  {id:'LON',nombre:'Loncomilla',taller:false},
  {id:'SRA',nombre:'San Rafael',taller:false},
  {id:'PHO',nombre:'Paso Hondo',taller:false},
  {id:'ROB',nombre:'El Roble',taller:false},
  {id:'LRO',nombre:'Las Rosas',taller:false},
  {id:'QNO',nombre:'Quilpué Norte',taller:false},
  {id:'CD',nombre:'CD Repuestos',taller:false,cd:true},
];
const SUC_BY_ID = Object.fromEntries(SUCURSALES.map(s=>[s.id,s]));
const PRIORIDAD_CD = ['POR','ALT','RIO','VHM','MIR','LON','SRA','PHO','ROB','LRO','QNO'];

const CATS = ['Frenos','Filtros','Suspensión','Motor','Correas','Eléctrico','Refrigeración','Embrague','Iluminación','Lubricantes'];
const NACIONAL = {'Mobil 1':true,'Bosch':true};
const VEHICULOS = [
  {marca:'Kestrel', modelos:['Trail','Summit'], anios:[2023,2024]},
  {marca:'Doran', modelos:['Vela','Nova'], anios:[2023,2024]},
];

const PRODUCTOS_BASE = [
 ['Pastilla de freno delantera','Frenos','TRW',1],['Pastilla de freno trasera','Frenos','TRW',1],
 ['Disco de freno ventilado 280mm','Frenos','Bosch',0],['Disco de freno sólido 260mm','Frenos','Bosch',0],
 ['Cañería flexible de freno','Frenos','TRW',0],['Cilindro de rueda','Frenos','TRW',0],
 ['Filtro de aceite','Filtros','Mann-Filter',1],['Filtro de aire','Filtros','Mann-Filter',1],
 ['Filtro de combustible','Filtros','Mann-Filter',0],['Filtro de habitáculo (polen)','Filtros','Mann-Filter',1],
 ['Amortiguador delantero','Suspensión','Monroe',0],['Amortiguador trasero','Suspensión','Monroe',0],
 ['Rótula de dirección','Suspensión','TRW',0],['Terminal de dirección','Suspensión','TRW',0],
 ['Buje de suspensión delantera','Suspensión','Monroe',0],['Barra estabilizadora','Suspensión','Monroe',0],
 ['Bujía de encendido','Eléctrico','NGK',1],['Batería 12V 60Ah','Eléctrico','Varta',0],
 ['Alternador','Eléctrico','Bosch',0],['Motor de partida','Eléctrico','Bosch',0],
 ['Sensor de oxígeno (sonda lambda)','Eléctrico','Bosch',0],['Bobina de encendido','Eléctrico','NGK',0],
 ['Correa de distribución','Correas','Gates',1],['Correa poly-V (accesorios)','Correas','Gates',0],
 ['Kit de distribución completo','Correas','Gates',0],['Tensor de correa','Correas','Gates',0],
 ['Bomba de agua','Refrigeración','Mahle',0],['Radiador de agua','Refrigeración','Mahle',0],
 ['Termostato','Refrigeración','Mahle',0],['Manguera de radiador superior','Refrigeración','Mahle',0],
 ['Kit de embrague','Embrague','Sachs',0],['Disco de embrague','Embrague','Sachs',0],
 ['Collarín (rodaje) de embrague','Embrague','Sachs',0],
 ['Ampolleta H4 12V','Iluminación','Bosch',0],['Ampolleta LED H7','Iluminación','Bosch',0],
 ['Foco delantero derecho','Iluminación','Mahle',0],
 ['Aceite motor 5W30 sintético 4L','Lubricantes','Mobil 1',1],['Aceite motor 15W40 mineral 4L','Lubricantes','Mobil 1',0],
 ['Refrigerante concentrado 1L','Lubricantes','Mobil 1',0],['Líquido de frenos DOT4 500cc','Lubricantes','Bosch',0],
 ['Bomba de combustible','Motor','Bosch',0],['Inyector de combustible','Motor','Bosch',0],
 ['Empaquetadura de tapa cilindro','Motor','Mahle',0],['Retén de cigüeñal','Motor','Mahle',0],
];
const PRODUCTOS = PRODUCTOS_BASE.map((p,i)=>{
  const [desc,cat,marca,pauta] = p;
  const costoBase = {Frenos:22000,Filtros:7500,Suspensión:38000,Motor:45000,Correas:26000,Eléctrico:34000,Refrigeración:24000,Embrague:65000,Iluminación:9000,Lubricantes:15000}[cat];
  const costo = Math.round(costoBase*rf(0.7,1.6,2)/10)*10;
  return {
    codigo: String(11+ (i%85)).padStart(2,'0')+' '+String(10000000+Math.floor(rand()*89999999)),
    descripcion: desc, categoria:cat, marca, proveedor:marca,
    nacional: !!NACIONAL[marca], pauta: !!pauta,
    unidad:'UN', costo,
    reemplazo: rand()<0.22 ? '—rep—' : null,
  };
});
PRODUCTOS.forEach((p,i)=>{ if(p.reemplazo==='—rep—'){ const cand=PRODUCTOS.filter(x=>x.categoria===p.categoria && x!==p); p.reemplazo = cand.length? pick(cand).codigo : null; } });

const USUARIOS = [
  {nombre:'Marcela Soto', email:'msoto@rumborepuestos.cl', rol:'admin', sucursalesPermitidas:null},
  {nombre:'Andrés Pino', email:'apino@rumborepuestos.cl', rol:'abastecimiento', sucursalesPermitidas:null},
  {nombre:'Camila Reyes', email:'creyes@rumborepuestos.cl', rol:'abastecimiento', sucursalesPermitidas:null},
  {nombre:'Jorge Tapia', email:'jtapia@rumborepuestos.cl', rol:'lectura', sucursalesPermitidas:['ALT','POR']},
  {nombre:'Fernanda Ulloa', email:'fulloa@rumborepuestos.cl', rol:'lectura', sucursalesPermitidas:null},
];

// ===================== Sugerido (producto × sucursal) =====================
const Z_ABC = {A:1.65,B:1.28,C:0.84,D:0};
const SUGERIDO = [];
PRODUCTOS.forEach(p=>{
  SUCURSALES.forEach(s=>{
    if(s.cd){ /* CD se trata aparte abajo */ }
    const incluir = s.taller || s.cd || rand()<0.55;
    if(!incluir) return;
    const demandaMensual = Math.max(1, Math.round(({Frenos:16,Filtros:26,Suspensión:8,Motor:9,Correas:10,Eléctrico:11,Refrigeración:9,Embrague:5,Iluminación:14,Lubricantes:30})[p.categoria]*rf(0.4,1.8,2)));
    const desvStd = +(demandaMensual*rf(0.22,0.55,2)).toFixed(1);
    const demandaDiaria = +(demandaMensual/30).toFixed(2);
    const abc = demandaMensual>=32?'A':demandaMensual>=16?'B':demandaMensual>=6?'C':'D';
    const leadTime = p.nacional ? ri(3,9) : ri(12,32);
    const leadTimeEfectivo = Math.min(leadTime, 21);
    const z = Z_ABC[abc];
    const stockSeguridad = Math.round(z*desvStd*Math.sqrt(leadTimeEfectivo/30));
    const puntoPedido = Math.round(demandaDiaria*leadTimeEfectivo + stockSeguridad);
    const nivelMaximo = Math.round(puntoPedido + demandaMensual*rf(0.7,1.3,2));
    const stockActivo = rand()<0.62 ? ri(0, Math.max(1,Math.round(puntoPedido*0.85))) : ri(puntoPedido, Math.round(nivelMaximo*1.6));
    const stockTransito = rand()<0.28 ? ri(1,Math.round(demandaMensual*0.4)) : 0;
    const abasteceCD = s.taller===true;
    const comprarEnCD = !!s.cd;
    let sugeridoSistema = 0;
    if(stockActivo+stockTransito < puntoPedido) sugeridoSistema = Math.max(0, nivelMaximo-stockActivo-stockTransito);
    let origen = sugeridoSistema>0 ? 'sugerido' : 'catalogo';
    let instock = false, sugeridoInstock = 0, vehiculoInstock=null;
    if(p.pauta && s.taller && rand()<0.85){
      vehiculoInstock = pick(VEHICULOS);
      instock = true;
      if(sugeridoSistema===0 && stockActivo<2){ sugeridoInstock = 2-stockActivo; origen='instock'; }
    }
    let sugeridoManual = 0;
    if(sugeridoSistema===0 && sugeridoInstock===0 && rand()<0.09){ sugeridoManual = ri(1,12); origen='manual'; }
    const sugeridoTotal = sugeridoSistema+sugeridoInstock+sugeridoManual;
    const sugeridoTrasladoCD = abasteceCD ? Math.round(sugeridoTotal*rf(0.3,0.7,2)) : 0;
    const sugCompraNeto = sugeridoTotal - sugeridoTrasladoCD;
    const valorTotal = sugeridoTotal*p.costo;
    const precioPublico = p.pauta ? Math.round(p.costo*rf(1.45,1.85,2)/10)*10 : null;
    const precioFlota = p.pauta ? Math.round(p.costo*rf(1.12,1.3,2)/10)*10 : null;
    SUGERIDO.push({
      id: uid(), producto:p.codigo, descripcion:p.descripcion, categoria:p.categoria, marca:p.marca, proveedor:p.proveedor, nacional:p.nacional, pauta:p.pauta,
      sucursal:s.id, sucursalNombre:s.nombre,
      abc, origen, instock, vehiculoInstock,
      demandaMensual, demandaDiaria, desvStd, leadTime, leadTimeEfectivo,
      stockActivo, stockTransito, stockSeguridad, puntoPedido, nivelMaximo,

const fNum = n => n==null?'—':new Intl.NumberFormat('es-CL').format(Math.round(n));
const fPct = (n,d) => n==null?'—':n.toFixed(d==null?1:d)+'%';
function fDate(d){ if(!d) return '—'; return [String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('-'); }
function fDateTime(d){ if(!d) return '—'; return fDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fRel(d){ const diffH=Math.round((NOW-d)/3600000); if(diffH<1) return 'hace instantes'; if(diffH<24) return 'hace '+diffH+' h'; return 'hace '+Math.round(diffH/24)+' d'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===================== Charts SVG (trazo simple, responsive vía viewBox) =====================
function barsH(data, opts={}){
  opts = Object.assign({fmt:fNum, color:'var(--chart-blue)'}, opts);
  const max = Math.max(1, ...data.map(d=>d.value));
  if(!data.length) return `<p class="muted small">Sin datos.</p>`;
  return `<div>${data.map(d=>`
    <div class="bar-h">
      <div class="bar-h__label" title="${esc(d.label)}">${esc(d.label)}</div>
      <div class="bar-h__track"><div class="bar-h__fill" style="width:${Math.max(2,(d.value/max*100)).toFixed(1)}%;background:${d.color||opts.color}"></div></div>
      <div class="bar-h__val tabular">${opts.fmt(d.value)}</div>
    </div>`).join('')}</div>`;
}
function barsV(data, opts={}){
  opts=Object.assign({height:190,color:'var(--chart-blue)',fmt:fNum},opts);
  const w = Math.max(380, data.length*50);
  const h = opts.height;
  const max = Math.max(1,...data.map(d=>d.value));
  const padL=10,padR=10,padB=24,padT=18;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const gap = innerW/data.length;
  const bw = Math.min(34, gap*0.5);
  let bars='', labels='';
  data.forEach((d,i)=>{
    const bh = Math.max(2, d.value/max*innerH);
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + innerH - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${d.color||opts.color}"><title>${esc(d.label)}: ${opts.fmt(d.value)}</title></rect>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" class="axislabel">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="aspect-ratio:${w}/${h}" preserveAspectRatio="xMinYMid meet" class="chart-svg">
    <line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--border-2)" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}
function donutChart(parts, opts={}){
  const size=opts.size||132, sw=opts.sw||24, r=(size-sw)/2, c=2*Math.PI*r;
  const total = parts.reduce((a,p)=>a+p.value,0)||1;
  let acc=0;
  const segs = parts.filter(p=>p.value>0).map(p=>{
    const frac = p.value/total;
    const dash = frac*c;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt"><title>${esc(p.label)}: ${fPct(frac*100)}</title></circle>`;
    acc += dash;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}</svg>`;
}
function sawtooth(opts){
  const {nivelMaximo,puntoPedido,stockSeguridad,leadTime,demandaDiaria,color} = opts;
  const w=760,h=160,padL=10,padR=10,padT=16,padB=24;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const dd = Math.max(0.3,demandaDiaria);
  const cicloDias = Math.max(leadTime+6, Math.round((nivelMaximo-stockSeguridad)/dd));
  const totalDias = cicloDias*2;
  const yFor = v => padT + innerH - Math.max(0,Math.min(1,v/nivelMaximo))*innerH;
  const xFor = d => padL + (d/totalDias)*innerW;
  let pts=[]; let d=0;
  for(let cycle=0;cycle<2;cycle++){
    pts.push([d,nivelMaximo]);
    const diasHastaPP = Math.max(1,(nivelMaximo-puntoPedido)/dd);
    d+=diasHastaPP; pts.push([d,puntoPedido]);
    const pisoCiclo = Math.max(stockSeguridad*0.55,1);
    const diasHastaFin = Math.max(1,(puntoPedido-pisoCiclo)/dd);
    d = Math.min(d+diasHastaFin,(cycle+1)*cicloDias-0.4); pts.push([d,pisoCiclo]);
    d=(cycle+1)*cicloDias; pts.push([d,nivelMaximo]);
  }
  const line = pts.map(p=>`${xFor(p[0]).toFixed(1)},${yFor(p[1]).toFixed(1)}`).join(' ');
  const area = `${padL.toFixed(1)},${(padT+innerH).toFixed(1)} `+line+` ${(padL+innerW).toFixed(1)},${(padT+innerH).toFixed(1)}`;
  const yPP=yFor(puntoPedido), ySS=yFor(stockSeguridad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="aspect-ratio:${w}/${h}" preserveAspectRatio="xMinYMid meet" class="chart-svg">
    <polygon points="${area}" fill="${color}" opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${padL}" y1="${yPP.toFixed(1)}" x2="${padL+innerW}" y2="${yPP.toFixed(1)}" stroke="var(--warning)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="${padL+innerW}" y="${(yPP-5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--warning)">Punto de pedido · ${fNum(puntoPedido)} u</text>
    <line x1="${padL}" y1="${ySS.toFixed(1)}" x2="${padL+innerW}" y2="${ySS.toFixed(1)}" stroke="var(--critical)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="${padL+innerW}" y="${(ySS-5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--critical)">Stock seguridad · ${fNum(stockSeguridad)} u</text>
    <line x1="${padL}" y1="${(padT+innerH).toFixed(1)}" x2="${padL+innerW}" y2="${(padT+innerH).toFixed(1)}" stroke="var(--border-2)"/>
  </svg>`;
}
function lineChart(series, opts={}){
  opts=Object.assign({height:170,color:'var(--chart-blue)',fmt:fNum},opts);
  const w=560,h=opts.height,padL=10,padR=10,padT=16,padB=22;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const vals=series.map(s=>s.value);
  const max=Math.max(1,...vals), min=Math.min(0,...vals);
  const xFor=(i)=>padL+(i/(series.length-1||1))*innerW;
  const yFor=(v)=>padT+innerH-((v-min)/((max-min)||1))*innerH;
  const line = series.map((s,i)=>`${xFor(i).toFixed(1)},${yFor(s.value).toFixed(1)}`).join(' ');
  const area = `${padL},${padT+innerH} `+line+` ${padL+innerW},${padT+innerH}`;
  const labelEvery = Math.ceil(series.length/6);
  const labels = series.map((s,i)=> i%labelEvery===0 ? `<text x="${xFor(i).toFixed(1)}" y="${h-6}" text-anchor="middle" class="axislabel">${esc(s.label)}</text>` : '').join('');
  const lastX=xFor(series.length-1), lastY=yFor(series[series.length-1].value);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="aspect-ratio:${w}/${h}" preserveAspectRatio="xMinYMid meet" class="chart-svg">
    <polygon points="${area}" fill="${opts.color}" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.4" fill="${opts.color}"/>
    ${labels}
  </svg>`;
}
function progressBar(pct,color){ return `<div class="progress"><div class="progress__bar" style="width:${Math.min(100,Math.max(0,pct)).toFixed(0)}%;background:${color||'var(--brand)'}"></div></div>`; }

// ===================== Tabla genérica ordenable + paginada =====================
function tableState(id){ if(!STATE.tables[id]) STATE.tables[id]={sort:null,dir:1,page:1}; return STATE.tables[id]; }
function renderTable(id, columns, rows, opts={}){
  const ts = tableState(id);
  let data = rows.slice();
  if(ts.sort){
    const col = columns.find(c=>c.key===ts.sort);
    data.sort((a,b)=>{
      const av = col&&col.sortVal?col.sortVal(a):a[ts.sort]; const bv = col&&col.sortVal?col.sortVal(b):b[ts.sort];
      if(av==null) return 1; if(bv==null) return -1;
      if(av<bv) return -1*ts.dir; if(av>bv) return 1*ts.dir; return 0;
    });
  }
  const pageSize = opts.pageSize||50;
  const totalPages = Math.max(1, Math.ceil(data.length/pageSize));
  if(ts.page>totalPages) ts.page=totalPages;
  const start=(ts.page-1)*pageSize;
  const pageRows = data.slice(start,start+pageSize);
  const thead = columns.map(c=>`<th class="${c.num?'num':''}" onclick="App.sortTable('${id}','${c.key}')">${esc(c.label)}${ts.sort===c.key?`<span class="sortarrow">${ts.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const body = pageRows.length ? pageRows.map(r=>`<tr class="${opts.rowHref?'clickable':''}" ${opts.rowHref?`onclick="location.hash='${opts.rowHref(r)}'"`:''}>${columns.map(c=>`<td class="${c.num?'num':''} ${c.mono?'tabular':''}">${c.render?c.render(r):esc(r[c.key]==null?'—':r[c.key])}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${columns.length}" class="tbl-empty">Sin resultados con los filtros actuales.</td></tr>`;
  return `<div class="table-wrap"><table class="tbl"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table>
    <div class="pager"><span>${fNum(data.length)} fila${data.length===1?'':'s'}</span><button ${ts.page<=1?'disabled':''} onclick="App.pageTable('${id}',-1,${totalPages})">${ic('chevright')}</button><span class="tabular">${ts.page} / ${totalPages}</span><button ${ts.page>=totalPages?'disabled':''} onclick="App.pageTable('${id}',1,${totalPages})">${ic('chevright')}</button></div></div>`;
}

// ===================== Utilidades de series (hash local, no mutan el RNG global) =====================
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
const MESES_LABEL=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function serieVentas(codigo, sucursalId){
  let s=hashStr(codigo+'|'+(sucursalId||''))||1;
  const lr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const base=14+(s%36);
  const out=[];
  for(let i=23;i>=0;i--){
    const d=new Date(NOW.getFullYear(),NOW.getMonth()-i,1);
    const estacional=1+0.25*Math.sin((d.getMonth()/12)*Math.PI*2);
    out.push({label:MESES_LABEL[d.getMonth()]+' '+String(d.getFullYear()).slice(2), value:Math.max(0,Math.round(base*estacional*(0.65+lr()*0.7))), periodo:d.getFullYear()*100+d.getMonth()+1});
  }
  return out;
}
function serieHistoria(row){
  let s=hashStr(row.id)||1;
  const lr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const dias=14; const vals=[row.stockActivo];
  let stock=row.stockActivo;
  for(let i=0;i<dias;i++){ stock=Math.max(0, stock+row.demandaDiaria*(0.5-lr())*2); vals.push(Math.round(stock)); }
  vals.reverse();
  return vals.map((v,i)=>({label:String(i+1)+'/'+String(NOW.getMonth()+1), value:v}));
}
function pedidosDe(row){
  const extra=(STATE.pedidosExtra&&STATE.pedidosExtra[row.id])||[];
  if(!row.yaPedido) return extra;
  const h=hashStr(row.id);
  return [{unidades:row.sugeridoTotal||(h%20+1), oc:'OC-'+(3000+h%900), fecha:new Date(NOW.getTime()-((h%9)+1)*86400000), recibido:h%2===0}].concat(extra);
}

// ===================== Vista: Inventario =====================
function inventarioAgg(){
  const bySuc={};
  sucursalesVisibles().forEach(s=>{ bySuc[s.id]={sucursal:s.nombre,valor:0,inmovilizado:0,sobreStock:0,quiebres:0,bajoPP:0,productos:0}; });
  SUGERIDO.forEach(r=>{
    const b=bySuc[r.sucursal]; if(!b) return;
    b.valor += r.stockActivo*r.costoUnitario; b.productos++;
    if(r.stockActivo>r.nivelMaximo*1.3){ b.sobreStock++; b.inmovilizado += (r.stockActivo-r.nivelMaximo)*r.costoUnitario; }
    if(r.stockActivo+r.stockTransito<=0 && r.demandaMensual>0) b.quiebres++;
    if(r.stockActivo<r.puntoPedido) b.bajoPP++;
  });
  return Object.values(bySuc).filter(b=>b.productos>0);
}
function viewInventario(){
  const agg=inventarioAgg();
  const valorTotal=agg.reduce((a,b)=>a+b.valor,0), inmovilizado=agg.reduce((a,b)=>a+b.inmovilizado,0);
  const sobreStock=agg.reduce((a,b)=>a+b.sobreStock,0), quiebres=agg.reduce((a,b)=>a+b.quiebres,0), bajoPP=agg.reduce((a,b)=>a+b.bajoPP,0);
  const coberturas=SUGERIDO.filter(r=>r.demandaDiaria>0 && sucursalPermitida(r.sucursal)).map(r=>r.stockActivo/r.demandaDiaria).sort((a,b)=>a-b);
  const mediana=coberturas.length?coberturas[Math.floor(coberturas.length/2)]:0;
  const top10=agg.slice().sort((a,b)=>b.inmovilizado-a.inmovilizado).slice(0,10).map(b=>({label:b.sucursal,value:b.inmovilizado}));
  const topInmovilizado=SUGERIDO.filter(r=>r.stockActivo>r.nivelMaximo*1.3 && sucursalPermitida(r.sucursal)).map(r=>({producto:r.producto,descripcion:r.descripcion,sucursalNombre:r.sucursalNombre,unidades:r.stockActivo-r.nivelMaximo,valor:(r.stockActivo-r.nivelMaximo)*r.costoUnitario})).sort((a,b)=>b.valor-a.valor).slice(0,30);
  return `
  <div class="section-title"><div><h2 class="editorial-rule">Salud del inventario</h2><p>Dónde está la plata detenida y dónde falta stock.</p></div>
    <div class="flex gap8 items-center">
      <select class="select" onchange="App.setInvUmbral(this.value)">
        <option value="90" ${STATE.inventario.umbral==90?'selected':''}>Sobre-stock sobre 90 días</option>
        <option value="180" ${STATE.inventario.umbral==180?'selected':''}>Sobre-stock sobre 180 días</option>
        <option value="365" ${STATE.inventario.umbral==365?'selected':''}>Sobre-stock sobre 365 días</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="App.rerender()">${ic('refresh')} Actualizar</button>
    </div>
  </div>
  ${kpiGrid([
    {label:'Valor del inventario', value:fCLP(valorTotal), icon:'boxes'},
    {label:'Inmovilizado', value:fCLP(inmovilizado), sub:fPct(inmovilizado/valorTotal*100)+' del valor', icon:'alert'},
    {label:'Sobre-stock', value:fNum(sobreStock), sub:`+${STATE.inventario.umbral} días de cobertura`, icon:'layers'},
    {label:'Quiebre con demanda', value:fNum(quiebres), icon:'alert'},
    {label:'Bajo punto de pedido', value:fNum(bajoPP), icon:'chart'},
    {label:'Cobertura mediana', value:Math.round(mediana)+' d', icon:'calendar'},
  ])}
  <div class="card card-pad" style="margin-bottom:16px;"><p class="kicker" style="margin-bottom:10px;">Plata inmovilizada por sucursal (top 10)</p>${barsH(top10,{fmt:fCLP,color:'var(--accent-500)'})}</div>
  <div class="grid-2">
    <div class="card"><div class="card-pad"><p class="kicker">Detalle por sucursal</p></div>${renderTable('inv-suc',[{key:'sucursal',label:'Sucursal'},{key:'valor',label:'Valor',num:true,mono:true,render:b=>fCLP(b.valor)},{key:'inmovilizado',label:'Inmovilizado',num:true,mono:true,render:b=>fCLP(b.inmovilizado)},{key:'sobreStock',label:'Sobre-stock',num:true},{key:'quiebres',label:'Quiebres',num:true},{key:'bajoPP',label:'Bajo PP',num:true},{key:'productos',label:'Productos',num:true}], agg, {pageSize:12})}</div>
    <div class="card"><div class="card-pad"><p class="kicker">Top inmovilizado</p></div>${renderTable('inv-top',[{key:'producto',label:'Producto',mono:true,render:r=>`<a href="#/catalogo/${encodeURIComponent(r.producto)}">${r.producto}</a>`},{key:'descripcion',label:'Descripción'},{key:'sucursalNombre',label:'Sucursal'},{key:'unidades',label:'Unidades',num:true,mono:true},{key:'valor',label:'Valor',num:true,mono:true,render:r=>fCLP(r.valor)}], topInmovilizado, {pageSize:12})}</div>
  </div>`;
}

function stepCard(n,t,d){ return `<div class="flex gap12" style="margin-bottom:14px;"><span class="stepnum">${n}</span><div><b>${esc(t)}</b><p class="muted small" style="margin:2px 0 0;">${d}</p></div></div>`; }
function viewModelo(){
  const secciones=[['fuentes','Fuentes de datos'],['limpieza','Limpieza de ventas'],['abc','Clasificación ABC'],['demanda','Demanda mensual'],['proveedor','Proveedor y lead time'],['cd','¿Se abastece por CD?'],['seguridad','Stock de seguridad'],['sugerido','El sugerido de compra'],['distribucion','Distribución y traslados'],['reglas','Reglas de negocio adicionales'],['parametros','Parámetros de referencia']];
  const prioridad = PRIORIDAD_CD.map(id=>SUC_BY_ID[id].nombre);
  return `
  <div class="section-title"><div><h2 class="editorial-rule">Cómo se calcula el sugerido</h2><p>Documentación viva del modelo, en el mismo orden en que corre el motor.</p></div><button class="btn btn-outline btn-sm" onclick="App.exportarModelo()">${ic('download')} Exportar a Word</button></div>
  <div style="display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:start;">
    <nav class="toc">${secciones.map(s=>`<a href="#modelo-${s[0]}">${esc(s[1])}</a>`).join('')}</nav>
    <div style="max-width:760px;">
      <h3 id="modelo-fuentes" style="margin-bottom:10px;">1. Fuentes de datos</h3>
      ${stepCard(1,'Maestro de productos','Código, descripción, familia, procedencia y costo, desde el ERP.')}
      ${stepCard(2,'Ventas consolidadas','Unidades y neto por producto, sucursal y período, desde 2018.')}
      ${stepCard(3,'Stock por bodega','Stock activo y en tránsito, por producto y sucursal, actualizado a diario.')}

      <h3 id="modelo-limpieza" style="margin:26px 0 10px;">2. Limpieza de ventas</h3>
      <p>Antes de calcular demanda, se recortan los picos con un <b>Winsor k=${CONFIG_MODELO.winsorK}</b>: cualquier mes que exceda k desviaciones estándar sobre la media se ajusta al límite, para que una venta puntual grande (ej. una flota) no infle el sugerido futuro.</p>

      <h3 id="modelo-abc" style="margin:26px 0 10px;">3. Clasificación ABC</h3>
      <p>Se clasifica por <b>frecuencia</b> de venta, no por facturación (no es un Pareto clásico):</p>
      <div class="table-wrap" style="margin-bottom:10px;"><table class="tbl"><thead><tr><th>Clase</th><th>Regla</th><th class="num">Nivel de servicio</th></tr></thead><tbody>
        <tr><td>${badgeAbc('A')}</td><td>Vendió en ${CONFIG_MODELO.abcA}+ de los últimos 12 meses</td><td class="num tabular">95%</td></tr>
        <tr><td>${badgeAbc('B')}</td><td>Vendió en ${CONFIG_MODELO.abcB}+ de los últimos 6 meses</td><td class="num tabular">90%</td></tr>
        <tr><td>${badgeAbc('C')}</td><td>Con venta reciente, no clasifica en A ni B</td><td class="num tabular">80%</td></tr>
        <tr><td>${badgeAbc('D')}</td><td>Sin venta en los últimos ${CONFIG_MODELO.abcC} meses</td><td class="num tabular">0%</td></tr>
      </tbody></table></div>

      <h3 id="modelo-demanda" style="margin:26px 0 10px;">4. Demanda mensual</h3>
      <p>Promedio móvil de ventas limpias, expresado en unidades por mes y por día (÷${CONFIG_MODELO.diasHabilesMes} días hábiles), junto a su desviación estándar — insumo directo del stock de seguridad.</p>

      <h3 id="modelo-proveedor" style="margin:26px 0 10px;">5. Proveedor y lead time</h3>
      <p>El lead time se mide entre la orden de compra y la recepción, por proveedor y sucursal. Si no hay historial suficiente, se usa el fallback de <b>${CONFIG_MODELO.ltFallback} días</b>, con un tope de <b>${CONFIG_MODELO.ltTope} días</b>.</p>

      <h3 id="modelo-cd" style="margin:26px 0 10px;">6. ¿Se abastece por CD?</h3>
      <p>Las sucursales con taller reciben por traslado desde el Centro de Distribución cuando conviene por volumen; el resto compra directo al proveedor. La prioridad de reparto entre sucursales cuando el CD no alcanza a cubrir a todas es:</p>
      <div class="flex gap8 wrap" style="margin-bottom:6px;">${prioridad.map((n,i)=>`<span class="chip">${i+1}. ${esc(n)}</span>`).join('')}</div>

      <h3 id="modelo-seguridad" style="margin:26px 0 10px;">7. Stock de seguridad</h3>
      <div class="formula">SS = Z(clase) × σ(demanda diaria) × √(lead time efectivo)</div>
      <p style="margin-top:10px;">Con Z según el nivel de servicio de la clase ABC. A mayor variabilidad de demanda o mayor lead time, mayor colchón.</p>

      <h3 id="modelo-sugerido" style="margin:26px 0 10px;">8. El sugerido de compra</h3>
      <div class="formula">Punto de pedido = demanda diaria × lead time efectivo + SS<br>Nivel máximo = punto de pedido + demanda del ciclo de reposición<br>Sugerido = nivel máximo − stock activo − stock en tránsito&nbsp;&nbsp;(si stock activo+tránsito &lt; punto de pedido)</div>

      <h3 id="modelo-distribucion" style="margin:26px 0 10px;">9. Distribución y traslados</h3>
      <p>Cuando una sucursal se abastece por CD, el sugerido se divide entre <b>traslado desde el CD</b> (si hay stock disponible ahí) y <b>compra neta al proveedor</b> por la diferencia.</p>

      <h3 id="modelo-reglas" style="margin:26px 0 10px;">10. Reglas de negocio adicionales</h3>
      <div class="callout" style="margin-bottom:10px;">${ic('info')}<div><b>InStock</b>: además del cálculo estadístico, se fuerza un mínimo de 2 unidades de los repuestos de pauta de mantención de ${VEHICULOS.map(v=>v.marca).join(' y ')} (${VEHICULOS[0].anios.join('–')}) en cada sucursal con taller, para nunca quedar sin ellos ante un service agendado.</div></div>
      <p>Los ajustes manuales y las sugerencias recurrentes se suman al cálculo del sistema, y quedan trazados en la Auditoría.</p>

      <h3 id="modelo-parametros" style="margin:26px 0 10px;">11. Parámetros de referencia (vigentes)</h3>
      ${renderTable('modelo-params',[{key:'k',label:'Parámetro'},{key:'v',label:'Valor'}],[
        {k:'Ciclo de orden directo',v:CONFIG_MODELO.cicloDirecto+' días'},{k:'Ciclo de orden CD',v:CONFIG_MODELO.cicloCD+' días'},
        {k:'Reposición a nivel máximo',v:(CONFIG_MODELO.reponerMaximoOn?'Activa — clases '+CONFIG_MODELO.reponerMaximoClases:'Inactiva')},
        {k:'Ventana tránsito nacional / importado',v:CONFIG_MODELO.ventanaNacional+' / '+CONFIG_MODELO.ventanaImportado+' días'},
        {k:'Winsor k',v:CONFIG_MODELO.winsorK}, {k:'Días hábiles / mes',v:CONFIG_MODELO.diasHabilesMes},
      ],{pageSize:20})}
    </div>
  </div>`;
}

function parseRoute(){
  const segs = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  if(!segs.length) return {name:'dashboard'};
  if(segs[0]==='compras') return {name:'compras'};
  if(segs[0]==='catalogo') return segs[1]? {name:'catalogo-detalle',codigo:segs[1]} : {name:'catalogo'};
  if(segs[0]==='producto') return {name:'producto-detalle', codigo:segs[1], sucursal:segs[2]};
  if(segs[0]==='sugerencias') return {name:'sugerencias'};
  if(segs[0]==='ventas') return {name:'ventas'};
  if(segs[0]==='inventario') return {name:'inventario'};
  if(segs[0]==='simulador') return {name:'simulador'};
  if(segs[0]==='incidencias') return {name:'incidencias'};
  if(segs[0]==='auditoria') return {name:'auditoria'};
  if(segs[0]==='modelo') return {name:'modelo'};
  if(segs[0]==='configuracion') return {name:'configuracion'};
  if(segs[0]==='cargar') return {name:'cargar'};
  return {name:'dashboard'};
}
function viewNoAutorizado(){ return `<div class="card card-pad tbl-empty">${ic('lock')}<p style="margin-top:10px;">No tienes permiso para ver esta sección con el rol actual.</p></div>`; }
function contentForRoute(){
  const r=parseRoute();
  switch(r.name){
    case 'compras': STATE.route='#/compras'; return viewCompras();
    case 'catalogo': STATE.route='#/catalogo'; return viewCatalogo();
    case 'catalogo-detalle': STATE.route='#/catalogo'; return viewCatalogoDetalle(r.codigo);
    case 'producto-detalle': STATE.route='#/'; return viewProductoDetalle(r.codigo, r.sucursal);
    case 'sugerencias': STATE.route='#/sugerencias'; return permisos().lectura? viewNoAutorizado() : viewSugerencias();
    case 'ventas': STATE.route='#/ventas'; return viewVentas();
    case 'inventario': STATE.route='#/inventario'; return viewInventario();
    case 'simulador': STATE.route='#/simulador'; return viewSimulador();
    case 'incidencias': STATE.route='#/incidencias'; return viewIncidencias();
    case 'auditoria': STATE.route='#/auditoria'; return viewAuditoria();
    case 'modelo': STATE.route='#/modelo'; return viewModelo();
    case 'configuracion': STATE.route='#/configuracion'; return permisos().calibra? viewConfiguracion() : viewNoAutorizado();
    case 'cargar': STATE.route='#/cargar'; return permisos().admin? viewCargar() : viewNoAutorizado();
    default: STATE.route='#/'; return viewDashboard();
  }
}
function render(){
  const root=document.getElementById('root');
  if(!STATE.auth){ root.innerHTML = STATE.showLogin ? viewLogin() : viewLanding(); return; }
  root.innerHTML = shellHTML(contentForRoute());
}

function tourPositionPop(rect, popEl){
  const margin=14;
  const popW=popEl.offsetWidth, popH=popEl.offsetHeight;
  const spaceBelow=window.innerHeight-rect.bottom;
  const top = spaceBelow>popH+margin+10 ? rect.bottom+margin : Math.max(margin, rect.top-popH-margin);
  const left = Math.min(Math.max(margin, rect.left), window.innerWidth-popW-margin);
  popEl.style.top=top+'px'; popEl.style.left=left+'px';
}
function tourRenderSpotlight(step, idx, total){
  const el = document.querySelector(step.selector);
  if(!el){ App.tourNext(); return; }
  const big = el.getBoundingClientRect().height > window.innerHeight*0.85;
  el.scrollIntoView(big?{block:'start'}:{block:'center'});
  setTimeout(()=>{
    const raw=el.getBoundingClientRect();
    const topbar=70;
    const rect={
      top: Math.max(raw.top, topbar),
      bottom: Math.min(raw.bottom, window.innerHeight-8),
      left: Math.max(raw.left, 8),
      right: Math.min(raw.right, window.innerWidth-8),
    };
    rect.width=Math.max(40, rect.right-rect.left); rect.height=Math.max(40, rect.bottom-rect.top);
    const pad=6;
    tourRoot().innerHTML = `<div class="tour-overlay"></div>
      <div class="tour-spot" style="top:${(rect.top-pad).toFixed(0)}px;left:${(rect.left-pad).toFixed(0)}px;width:${(rect.width+pad*2).toFixed(0)}px;height:${(rect.height+pad*2).toFixed(0)}px;"></div>
      <div class="tour-pop" id="tour-pop">
        <div class="tour-pop__kicker"><span class="kicker">Paso ${idx} de ${total}</span><button class="iconbtn" style="width:22px;height:22px;" onclick="App.tourEnd()">${ic('x')}</button></div>
        <h4>${esc(step.title)}</h4>
        <p>${esc(step.text)}</p>
        <div class="tour-pop__foot">
          <div class="tour-dots">${Array.from({length:total}).map((_,i)=>`<span class="${i===idx-1?'on':''}"></span>`).join('')}</div>
          <div class="flex gap8">
            ${idx>1?`<button class="btn btn-ghost btn-sm" onclick="App.tourPrev()">Atrás</button>`:''}
            <button class="btn btn-primary btn-sm" onclick="App.tourNext()">${idx===total?'Finalizar':'Siguiente'} ${ic('arrowright')}</button>
          </div>
        </div>
      </div>`;
    tourPositionPop(rect, document.getElementById('tour-pop'));
  });
}

const App = {
  // Auth
  setLoginRol(r){
    STATE.pendingRol=r;
    const u=USUARIOS.find(x=>x.rol===r);
    const emailInput=document.getElementById('login-email');
    if(u && emailInput) emailInput.value=u.email;
  },
  goShowLogin(){ STATE.showLogin=true; render(); window.scrollTo(0,0); },
  backToLanding(){ STATE.showLogin=false; render(); window.scrollTo(0,0); },
  login(){
    const email=(document.getElementById('login-email').value||'').trim().toLowerCase();
    const rol=STATE.pendingRol||'admin';
    const user=USUARIOS.find(u=>u.email.toLowerCase()===email) || USUARIOS.find(u=>u.rol===rol) || USUARIOS[0];
    STATE.auth=true; STATE.user=user; STATE.rol=rol;
    location.hash='#/'; render();
    showToast('Bienvenida/o, '+user.nombre.split(' ')[0]+'.');
    if(!STATE.tour.visto) setTimeout(()=>App.startTour(), 900);
  },
  logout(){ STATE.auth=false; STATE.user=null; STATE.sidebarOpen=false; STATE.notifOpen=false; STATE.chatOpen=false; render(); },
  // Shell
  goto(href){ STATE.notifOpen=false; location.hash=href; render(); },
  openSidebar(){ STATE.sidebarOpen=true; render(); },
  closeSidebar(){ STATE.sidebarOpen=false; render(); },
  toggleNotif(e){ if(e) e.stopPropagation(); STATE.notifOpen=!STATE.notifOpen; render(); },
  closeNotif(){ STATE.notifOpen=false; render(); },
  toggleChat(){ STATE.chatOpen=!STATE.chatOpen; render(); },
  rerender(){ render(); },
  // Chat
  chatAsk(q){
    STATE.chatMsgs.push({who:'user',text:q}); STATE.chatMsgs.push({who:'bot',text:App.chatRespuesta(q)});
    render();
    setTimeout(()=>{ const b=document.getElementById('chat-body'); if(b) b.scrollTop=b.scrollHeight; },0);
  },
  chatSend(){ const inp=document.getElementById('chat-input'); if(!inp) return; const q=inp.value.trim(); if(!q) return; App.chatAsk(q); },
  chatRespuesta(q){
    const ql=q.toLowerCase();
    const codeMatch=q.match(/\d{1,2}\s?\d{6,9}/);
    const norm=s=>s.replace(/\s/g,'');
    const prodByCode = codeMatch ? PRODUCTOS.find(p=>norm(p.codigo).includes(norm(codeMatch[0]))) : null;
    const prodByText = !prodByCode ? PRODUCTOS.find(p=>p.descripcion.toLowerCase().split(' ').some(w=>w.length>4 && ql.includes(w))) : null;
    const prod = prodByCode || prodByText;

    if(ql.includes('instock')) return 'InStock obliga a mantener al menos 2 unidades de los repuestos de pauta de '+VEHICULOS.map(v=>v.marca).join(' y ')+' en cada sucursal con taller, sin importar el cálculo estadístico normal.';
    if(ql.includes('quiebre')) return 'Ahora mismo hay '+SUGERIDO.filter(r=>r.stockActivo+r.stockTransito<=0&&r.demandaMensual>0&&sucursalPermitida(r.sucursal)).length+' líneas en quiebre con demanda activa (dentro de lo que puedes ver). Revisa Inventario para el detalle por sucursal.';
    if(ql.includes('ranking')||ql.includes('top')||ql.includes('mayores')){
      const top=SUGERIDO.filter(r=>r.pedir&&sucursalPermitida(r.sucursal)).sort((a,b)=>b.valorTotal-a.valorTotal).slice(0,3);
      if(!top.length) return 'No hay líneas con sugerido activo para armar un ranking ahora mismo.';
      return 'Los 3 productos con mayor valor sugerido hoy: '+top.map(r=>`${r.producto} (${r.descripcion}) en ${r.sucursalNombre} — ${fCLP(r.valorTotal)}`).join('; ')+'.';
    }
    if(prod){
      const filas=SUGERIDO.filter(r=>r.producto===prod.codigo&&sucursalPermitida(r.sucursal));
      if(!filas.length) return `${prod.codigo} existe en el catálogo, pero no en las sucursales que puedes ver.`;
      const stockTotal=filas.reduce((a,r)=>a+r.stockActivo,0);
      const sugTotal=filas.reduce((a,r)=>a+r.sugeridoTotal,0);
      if(ql.includes('precio')||ql.includes('ford')||ql.includes('margen')||ql.includes('flota')){
        const conPrecio=filas.find(r=>r.precioPublico);
        if(conPrecio) return `${prod.codigo} (${prod.descripcion}): precio público ${fCLP(conPrecio.precioPublico)}, flota ${fCLP(conPrecio.precioFlota)}, margen ${fPct(conPrecio.margenPct)}.`;
        return `${prod.codigo} no tiene lista de precios de flota — no es un repuesto de pauta.`;
      }
      if(ql.includes('venta')||ql.includes('histor')){
        const serie=serieVentas(prod.codigo,null).slice(-3);
        return `Ventas de ${prod.codigo} en los últimos 3 meses: `+serie.map(s=>`${s.label} ${s.value} u`).join(', ')+'.';
      }
      return `${prod.codigo} (${prod.descripcion}): stock activo ${fNum(stockTotal)} u, sugerido hoy ${fNum(sugTotal)} u, en ${filas.length} sucursal(es) que puedes ver.`;
    }
    if(ql.includes('bosch')) return 'Este mes el sugerido a Bosch suma '+fCLP(SUGERIDO.filter(r=>r.proveedor==='Bosch'&&r.pedir&&sucursalPermitida(r.sucursal)).reduce((a,r)=>a+r.valorTotal,0))+' en '+SUGERIDO.filter(r=>r.proveedor==='Bosch'&&r.pedir&&sucursalPermitida(r.sucursal)).length+' líneas.';
    if(ql.includes('manual')||ql.includes('vigente')) return 'Hay '+ALL_MANUALES.length+' sugerencias manuales vigentes y '+RECURRENTES.length+' reglas recurrentes activas.';
    if(ql.includes('alto')||ql.includes('por qué')||ql.includes('por que')) return 'El sugerido sube cuando el stock cae bajo el punto de pedido, la demanda reciente creció, o aplica la regla InStock. Revisa la ficha del producto para ver el desglose exacto.';
    return 'No encontré esa consulta en esta demo — en la versión real, el asistente consulta la base en vivo con más de una decena de herramientas (stock, ranking, histórico, precios FORD, sugerencias vigentes, etc.). Prueba con un código o nombre de producto, o una de las sugerencias de arriba.';

  consultarVentas(){
    const prodQ=(document.getElementById('vh-producto').value||'').trim().toLowerCase();
    const sucId=document.getElementById('vh-sucursal').value;
    const desde=(document.getElementById('vh-desde').value||'').trim();
    const hasta=(document.getElementById('vh-hasta').value||'').trim();
    STATE.ventas.producto=prodQ; STATE.ventas.sucursal=sucId; STATE.ventas.desde=desde; STATE.ventas.hasta=hasta;
    let prods=PRODUCTOS.filter(p=>!prodQ||p.codigo.toLowerCase().includes(prodQ)||p.descripcion.toLowerCase().includes(prodQ));
    prods = prodQ? prods.slice(0,15) : prods.slice(0,6);
    if(!prods.length){ showToast('No se encontraron productos con ese criterio.','err'); return; }
    const sucs = sucId? [SUC_BY_ID[sucId]] : sucursalesVisibles().filter(s=>!s.cd);
    const serieMap={}, sucMap={}, detalle=[];
    prods.forEach(p=>{ sucs.forEach(s=>{
      serieVentas(p.codigo,s.id).filter(pt=>(!desde||String(pt.periodo)>=desde)&&(!hasta||String(pt.periodo)<=hasta)).forEach(pt=>{
        serieMap[pt.label]=(serieMap[pt.label]||0)+pt.value;
        const neto=pt.value*p.costo;
        sucMap[s.nombre]=sucMap[s.nombre]||{sucursal:s.nombre,unidades:0,neto:0};
        sucMap[s.nombre].unidades+=pt.value; sucMap[s.nombre].neto+=neto;
        detalle.push({periodo:pt.label,producto:p.codigo,sucursal:s.nombre,unidades:pt.value,neto});
      });
    }); });
    const order=serieVentas(prods[0].codigo,null).map(s=>s.label);
    STATE.ventas.resultados={serie:order.map(label=>({label,value:serieMap[label]||0})), porSucursal:Object.values(sucMap), detalle:detalle.slice(0,400)};
    render();

  // Simulador / impacto compartido con Configuración
  calcularImpacto(f){
    const zMap={A:f.zA,B:f.zB,C:f.zC,D:f.zD};
    let actual=0, simulada=0, lineasCambian=0;
    const bySuc={}, byProd={};
    SUGERIDO.forEach(r=>{
      const leadEff=Math.min(r.leadTime*f.factorLT,45);
      const z=zMap[r.abc];
      const ss=Math.round(z*r.desvStd*Math.sqrt(leadEff/30));
      const pp=Math.round(r.demandaDiaria*leadEff+ss);
      const nm=Math.round(pp+Math.max(r.nivelMaximo-r.puntoPedido, r.demandaMensual*0.3));
      let sugSim=0;
      if(r.stockActivo+r.stockTransito<nm) sugSim=Math.max(0,nm-r.stockActivo-r.stockTransito);
      sugSim += r.sugeridoManual+r.sugeridoInstock;
      const valActual=r.valorTotal, valSim=sugSim*r.costoUnitario;
      actual+=valActual; simulada+=valSim;
      if(Math.round(sugSim)!==Math.round(r.sugeridoTotal)) lineasCambian++;
      bySuc[r.sucursalNombre]=bySuc[r.sucursalNombre]||{sucursal:r.sucursalNombre,actual:0,simulado:0};
      bySuc[r.sucursalNombre].actual+=valActual; bySuc[r.sucursalNombre].simulado+=valSim;
      byProd[r.producto]=byProd[r.producto]||{producto:r.producto,descripcion:r.descripcion,actual:0,simulado:0};
      byProd[r.producto].actual+=r.sugeridoTotal; byProd[r.producto].simulado+=sugSim;
    });
    const porSucursal=Object.values(bySuc).map(b=>({...b,delta:b.simulado-b.actual})).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,20);
    const porProducto=Object.values(byProd).map(b=>({...b,delta:b.simulado-b.actual})).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,20);
    return {actual,simulada,diff:simulada-actual,diffPct:actual?(simulada/actual-1)*100:0,lineasCambian,porSucursal,porProducto};
  },
